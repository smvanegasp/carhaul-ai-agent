# Weekly updates. Minor and patch updates come grouped in one PR per ecosystem (safe to merge
# when CI is green); major versions come as their own PRs, to test before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /agent
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      # Python 3.12 is pinned on purpose (pyproject requires-python); upgrade it deliberately.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: docker
    directory: /agent
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: weekly }
    groups: { terraform: { patterns: ["*"], update-types: [minor, patch] } }
