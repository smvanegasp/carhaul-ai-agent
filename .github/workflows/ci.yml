name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Offline tests only; `-m live` tests call paid APIs and run locally on purpose.
      - run: uv run pytest -q

  # Mia's reference conversations against the real LLM (Groq), with fake CarHauler/geocoding.
  # Needs the GROQ_API_KEY repository secret; skipped (with a notice) without it.
  # The model is not deterministic: a few scenarios miss about 1 run in 5 (BACKLOG, stage 8),
  # which failed main after PR #22. A failed scenario is retried twice, so only one that
  # fails 3 times in a row (a real regression, ~1% for a 1-in-5 flake) fails the build. Pass
  # rates per scenario come from the stage 7 simulations, not from this job.
  scenarios:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    defaults:
      run:
        working-directory: agent
    steps:
      - if: env.GROQ_API_KEY == ''
        working-directory: . # agent/ doesn't exist without a checkout
        run: echo "::notice::GROQ_API_KEY secret not set; skipping LLM scenario tests"
      - if: env.GROQ_API_KEY != ''
        uses: actions/checkout@v7
      - if: env.GROQ_API_KEY != ''
        uses: astral-sh/setup-uv@v7
      - if: env.GROQ_API_KEY != ''
        run: uv sync --frozen
      - if: env.GROQ_API_KEY != ''
        run: uv run pytest -m llm -q --reruns 2 --reruns-delay 2

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The "lambda" stage pulls from public ECR, which rate-limits shared CI runners;
      # it is built at deploy time instead.
      - run: docker build --target app ./backend
      - run: docker build ./agent

  # The repo is public: fail the build if a key, token or password ever lands in a commit.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra
      # No backend or AWS credentials in CI: this only checks the configuration.
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
