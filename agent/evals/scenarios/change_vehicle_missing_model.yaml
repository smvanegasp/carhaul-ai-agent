# Call 6fe7729baa7b (Belinda, 2026-11-11): "Yes. But I made a mistake... I want to change the Honda
# for my Jeep. My Jeep is a twenty twenty five Jeep." The change needed the model; the Jeep was
# forgotten, Mia read the Honda back, and "It's a Wrangler" went to the Honda. (A Ford here: the
# fake catalog has no Jeep.)
id: change_vehicle_missing_model
persona: NG_C_NV
path: NHP
ground_truth:
  origin: Boston, Massachusetts
  destination: San Francisco, California
  vehicles: [2024 Ford F-150, 2020 Toyota 4Runner]
turns:
  - user: >-
      I need to send my two cars from Boston, Massachusetts to San Francisco, California. A 2025
      Honda Civic and a 2020 Toyota 4Runner.
    expect:
      on_file: {vehicles: [2025 Honda Civic, 2020 Toyota 4Runner]}
      no_tools: [get_quote]
  - user: >-
      Yes. But I made a mistake, sorry for that. I want to change the Honda for my Ford. My Ford
      is a twenty twenty four Ford.
    expect:
      no_tools: [get_quote]
      judge: >-
        Asks for the model of the 2024 Ford (naming the 2024 Ford is fine). It doesn't read the
        Honda Civic back as if it were still being shipped, and doesn't ask about body types.
  - user: "It's an F-150."
    expect:
      on_file: {vehicles: [2024 Ford F-150, 2020 Toyota 4Runner]}
      no_tools: [get_quote]
      judge: >-
        Reads back the 2024 Ford F-150 and the 2020 Toyota 4Runner with the route and asks the
        caller to confirm.
  - user: "Yes, that's right."
    expect:
      tools: [get_quote]
