# Reference conversation 3: three vehicles, two of the same make.
id: happy_path_ngc_3v
persona: NG_C_NV
path: SHP
ground_truth:
  origin: Boston, Massachusetts
  destination: San Francisco, California
  vehicles: [2025 Honda Civic, 2020 Toyota 4Runner, 2019 Toyota Corolla]
turns:
  - user: "Yeah, sure"
    expect:
      on_file: {origin: null, destination: null, vehicles: []}
  - user: "I need to send three cars from Boston, MA to SF California"
    expect:
      on_file: {origin: "Boston, Massachusetts", destination: "San Francisco, California"}
  - user: "It's a 2025 Honda Civic"
    expect:
      on_file: {vehicles: [2025 Honda Civic]}
      judge: Asks about the second car (its year, make and model, or just which car it is).
  - user: "It's a Toyota 4Runner from 2020"
    expect:
      on_file: {vehicles: [2025 Honda Civic, 2020 Toyota 4Runner]}
      judge: Asks about the third car (its year, make and model, or just which car it is).
  - user: "It's a 2019 Toyota Corolla"
    expect:
      on_file: {vehicles: [2025 Honda Civic, 2020 Toyota 4Runner, 2019 Toyota Corolla]}
      no_tools: [get_quote]
      judge: Reads back all three vehicles and the route, and asks the caller to confirm.
  - user: "Correct"
    expect:
      tools: [get_quote]
      says:
        - "$3,430"
        - "$1,291 for the Honda"
        - "$1,020 for the Toyota 4Runner"
        - "$1,119 for the Toyota Corolla"
