id: make_only_and_yep
persona: NG_P_NV
path: SHP
ground_truth:
  origin: Boston, Massachusetts
  destination: San Francisco, California
  vehicles: [2021 Ford F-150]
turns:
  - user: "Yeah. Let's start."
