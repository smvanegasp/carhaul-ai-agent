      judge: >-
        Asks for the year and/or model of the Ford. It must not say it couldn't find the
        model.
  - user: "It's a twenty twenty one F one fifty."
    expect:
      on_file: {vehicles: [2021 Ford F-150]}
  - user: "Yep."
    expect:
      tools: [get_quote]
