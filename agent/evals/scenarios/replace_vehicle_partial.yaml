# Call 9ea951ab02c2 (Belinda, 2026-11-11): at the read-back the caller swapped one car for "my
# twenty twenty four Honda" (no model). The swap happened in one step, the 2024 Honda was
# forgotten, and Mia asked for the second car's year, make and model; the caller then said 2020.
id: replace_vehicle_partial
persona: NG_C_NV
path: NHP
ground_truth:
  origin: Boston, Massachusetts
  destination: San Francisco, California
  vehicles: [2025 Honda Civic, 2024 Ford F-150]
turns:
  - user: >-
      From Boston, Massachusetts to San Francisco, California. I have two cars, a 2025 Honda
      Civic and a 2020 Toyota 4Runner.
    expect:
      on_file: {vehicles: [2025 Honda Civic, 2020 Toyota 4Runner]}
      no_tools: [get_quote]
  - user: >-
      Actually, I made a mistake. I no longer need the Toyota. I want to send my twenty twenty
      four Ford instead.
    expect:
      no_tools: [get_quote]
      judge: >-
        Asks only for the model of the 2024 Ford (it doesn't ask for the year or the make
        again).
  - user: "It's an F-150."
    expect:
      on_file: {vehicles: [2025 Honda Civic, 2024 Ford F-150]}
      no_tools: [get_quote]
