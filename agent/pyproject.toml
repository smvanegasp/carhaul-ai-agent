[project]
name = "mia-agent"
version = "0.1.0"
description = "Mia, the F&F car-shipping voice agent (LiveKit worker)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "googlemaps>=4.10.0",
    "httpx>=0.28.1",
    "livekit-agents[groq]>=1.8.11",
    "python-dotenv>=1.0.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.14",
]
# Jupyter kernel for notebooks/ (exploration only; not in the Docker image).
notebooks = ["ipykernel>=6.29"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call paid APIs (Google Maps, CarHauler) and llm tests call Groq. Both are skipped
# by default; run them on purpose with `uv run pytest -m live` or `-m llm`.
addopts = "-m 'not live and not llm'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real external API (costs money / quota)",
    "llm: talks to the real LLM (Groq); fake CarHauler and geocoder",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.build-backend]
module-name = "mia"
