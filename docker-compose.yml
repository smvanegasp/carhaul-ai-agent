# Local development. `docker compose up` then open http://localhost:5190.
# The agent worker joins in stage 3 (it connects out to LiveKit Cloud; no port needed).
name: carhaul

services:
  api:
    build:
      context: ./backend
      target: app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    env_file:
      - path: ./.env
        required: false
    environment:
      # Docker on Windows doesn't forward file-change events into containers.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8020:8080"
    volumes:
      - ./backend/app:/app/app

  web:
    image: node:22-alpine
    working_dir: /app
    # --host on the command line survives Vite restarting itself; the config alone does not.
    command: sh -c "npm ci && npm run dev -- --host"
    environment:
      API_URL: http://api:8080
      VITE_USE_POLLING: "1"
    ports:
      - "5190:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  web_node_modules:
