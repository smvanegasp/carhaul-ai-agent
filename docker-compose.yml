# Local development. `docker compose up` then open http://localhost:5190 and press "Call Mia".
# The agent worker connects out to LiveKit Cloud (no port needed). Don't also run
# `python -m mia.main dev` on the host: both would register as "mia" and share the calls.
# Share with the teammate: `ngrok http 5190` (see README).
name: carhaul

services:
  api:
    build:
      context: ./backend
      target: app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    env_file:
      - path: ./.env
        required: false
    environment:
      # Docker on Windows doesn't forward file-change events into containers.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8020:8080"
    volumes:
      - ./backend/app:/app/app

  web:
    image: node:22-alpine
    working_dir: /app
    # --host on the command line survives Vite restarting itself; the config alone does not.
    command: sh -c "npm ci && npm run dev -- --host"
    environment:
      API_URL: http://api:8080
      VITE_USE_POLLING: "1"
    ports:
      - "5190:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  agent:
    build: ./agent
    env_file:
      - path: ./.env
        required: false
    environment:
      MIA_IDLE_PROCESSES: "1"
      MIA_TURN_DETECTOR: ${MIA_TURN_DETECTOR:-}
    volumes:
      # The CarHauler catalog snapshot survives restarts (catalog calls cost API allowance).
      - agent_cache:/home/mia/.cache/mia

volumes:
  web_node_modules:
  agent_cache:
